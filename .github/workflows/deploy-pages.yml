name: Verify and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - run: npm install --global firebase-tools@15.26.0
      - run: npm run test:rules
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy_firestore_rules:
    name: Deploy Firestore rules
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment:
      name: firebase-production
      url: https://console.firebase.google.com/project/horner-next-ten-isaiah/firestore/rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          project_id: horner-next-ten-isaiah
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - run: npm install --global firebase-tools@15.26.0
      - name: Validate Firestore rules deployment
        run: firebase deploy --only firestore:rules --dry-run --non-interactive --project horner-next-ten-isaiah
      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --non-interactive --project horner-next-ten-isaiah

  deploy_pages:
    name: Deploy GitHub Pages
    needs: deploy_firestore_rules
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
