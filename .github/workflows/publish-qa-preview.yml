name: Publish QA preview

on:
  # Both triggers close the race if verification finishes after the QA build.
  workflow_run:
    workflows: [Build QA preview, Verify pull request]
    types: [completed]

permissions: {}

# Serialize publication without replacing another PR's pending run.
# GitHub retains up to 100 pending runs; a full queue still fails closed.
concurrency:
  group: qa-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Publish validated QA files
    if: >-
      vars.QA_PREVIEWS_ENABLED == 'true' &&
      github.repository == 'isaiahgman/horner' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: firebase-qa
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      # workflow_run resolves this workflow from the default branch, never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Test trusted validator
        run: python3 -I -m unittest discover -s scripts -p 'qa*_test.py'
      - name: Validate current PR, trusted workflow, checks, and artifact
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          QA_PREVIEWS_ENABLED: ${{ vars.QA_PREVIEWS_ENABLED }}
        run: python3 -I scripts/qa_preview.py gate
      # Only this pinned action and reviewed Python run after validation. No npm,
      # shell sourced from artifacts, Firebase CLI, PR checkout, or PR scripts.
      - name: Obtain short-lived QA-only identity
        if: steps.gate.outputs.ready == 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.gate.outputs.provider }}
          service_account: ${{ steps.gate.outputs.service_account }}
          project_id: ${{ steps.gate.outputs.project }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.hosting
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish static files to seven-day QA channel
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QA_PREVIEWS_ENABLED: ${{ vars.QA_PREVIEWS_ENABLED }}
          QA_GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          QA_STAGE: ${{ steps.gate.outputs.stage }}
        run: python3 -I scripts/qa_preview.py publish
