name: Verify pull request

on:
  # Verify stacked PRs as well as PRs targeting main. Permissions stay read-only.
  pull_request:

permissions:
  contents: read

# Keep draft PR verification independent of the production deployment queue.
concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify proposed changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - run: npm install --global firebase-tools@15.26.0
      - run: npm run test:rules
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:e2e:webkit
      - name: Build isolated QA mode
        run: npm run build:qa
        env:
          QA_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          QA_PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: npm run test:qa
